# Join an existing Traefik instead of publishing a port. Copy, edit the host name and the network
# and certificate resolver names to match your Traefik, then:
#   docker compose -f docker-compose.yml -f compose.traefik.example.yml up -d
# (naming the files with -f replaces COMPOSE_FILE from .env, so no host port is published)
services:
  web:
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.kantahan.rule: Host(`kantahan.example`)
      traefik.http.routers.kantahan.entrypoints: websecure
      traefik.http.routers.kantahan.tls.certresolver: letsencrypt
      traefik.http.services.kantahan.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
