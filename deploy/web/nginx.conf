# Serves the PWA and the published catalog, and forwards /api/ to the contact service.
# TLS is terminated by the reverse proxy in front of this container.

# One visitor can use any address in their IPv6 /64, so those share one limit.
map $remote_addr $limit_key {
    "~^(?<v6net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $v6net;
    default $remote_addr;
}
limit_req_zone $limit_key zone=contact:1m rate=30r/m;

# The client address comes from the reverse proxy in front (private ranges only).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files or half-written ones (a backup restore or a publish may leave some).
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location ~ \.(part|tmp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # The shell and its pages: always revalidated, so a new release is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Built assets carry a content hash in their name and never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /brand/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The service worker and the manifest must never be served stale.
    location ~ ^/(sw\.js|workbox-[\w-]+\.js|registerSW\.js|manifest\.webmanifest|theme-init\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The catalog: the manifest is revalidated every time; each version folder is immutable.
    location = /catalog/manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ ^/catalog/v[0-9]+/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /catalog/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The contact service is looked up when a request arrives, so the site stays up if it is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        access_log off; # visitors' messages and addresses are not logged here
        set $contact_upstream http://contact:8000;
        limit_req zone=contact burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass $contact_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
