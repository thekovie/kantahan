# Included by every location that sets its own headers (nginx drops inherited add_header
# directives as soon as a location adds one of its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Everything is self-hosted: no third-party scripts, fonts, analytics or frames. The number tokens set a
# CSS variable per element through the browser's style API, which a style-src policy does not block.
# Small fonts are inlined into the stylesheet as data: URIs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __THEME_SCRIPT_HASH__; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
