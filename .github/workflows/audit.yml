name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: advisories appear after code is merged
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Web app (runtime dependencies)
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Catalog pipeline and contact service (runtime dependencies)
        run: |
          for project in catalog server/contact; do
            (cd "$project" && uv venv --python 3.12 .venv -q && uv pip install --python .venv/bin/python -q -e . \
              && uvx pip-audit --path .venv/lib/python3.12/site-packages)
          done
